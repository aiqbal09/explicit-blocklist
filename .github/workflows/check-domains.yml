name: Check Dead Domains

on:
  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check domains
        run: |
          python scripts/check_domains.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dead-domain-report
          path: reports/dead-domains.md
