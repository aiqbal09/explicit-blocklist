name: Sync NextDNS Denylist

on:

  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run:

          pip install -r requirements.txt


      - name: Sync NextDNS
        env:

          NEXTDNS_API_KEY:
            ${{ secrets.NEXTDNS_API_KEY }}

          NEXTDNS_PROFILE_ID:
            ${{ secrets.NEXTDNS_PROFILE_ID }}

        run:

          python scripts/sync_nextdns.py
          